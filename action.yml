name: 'Setup upkg'
description: 'Install upkg, the universal package manager'
branding:
  icon: 'package'
  color: 'blue'

inputs:
  version:
    description: 'Version to install (e.g. "0.9.1"). Defaults to latest.'
    required: false
    default: 'latest'
  token:
    description: 'GitHub token for API requests (avoids rate limiting).'
    required: false
    default: ${{ github.token }}
  update:
    description: 'Refresh native package manager metadata after installing upkg.'
    required: false
    default: 'true'

outputs:
  version:
    description: 'The installed version of upkg'
    value: ${{ steps.install.outputs.version || steps.install-windows.outputs.version }}

runs:
  using: 'composite'
  steps:
    # setup.sh is POSIX sh: Alpine job containers have no bash. Windows only
    # offers bash. $GITHUB_ACTION_PATH, unlike github.action_path, is
    # translated for job containers.
    - id: install
      if: runner.os != 'Windows'
      shell: sh
      env:
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_UPDATE: ${{ inputs.update }}
        GITHUB_API_TOKEN: ${{ inputs.token }}
      run: sh "$GITHUB_ACTION_PATH/setup.sh"

    - id: install-windows
      if: runner.os == 'Windows'
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_UPDATE: ${{ inputs.update }}
        GITHUB_API_TOKEN: ${{ inputs.token }}
      run: bash "$GITHUB_ACTION_PATH/setup.sh"
