name: 'Setup upkg'
description: 'Install upkg, the universal package manager'
branding:
  icon: 'package'
  color: 'blue'

inputs:
  version:
    description: 'Version to install (e.g. "0.9.1"). Defaults to latest.'
    required: false
    default: 'latest'
  token:
    description: 'GitHub token for API requests (avoids rate limiting).'
    required: false
    default: ${{ github.token }}
  update:
    description: 'Refresh native package manager metadata after installing upkg.'
    required: false
    default: 'true'

outputs:
  version:
    description: 'The installed version of upkg'
    value: ${{ steps.install.outputs.version }}

runs:
  using: 'composite'
  steps:
    - id: install
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
        GITHUB_API_TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail

        REPO="seuros/upkg"
        CURL=(curl -fsSL --retry 3 --retry-delay 2 --retry-connrefused)

        # curl wrapper: try authenticated (if a token is set), then fall back to
        # an unauthenticated request. upkg is a public repo, so a bad or missing
        # token must never break the install — it only exists to dodge rate limits.
        fetch() {
          local out="$1" url="$2"
          if [ -n "${GITHUB_API_TOKEN:-}" ]; then
            if "${CURL[@]}" -H "Authorization: Bearer ${GITHUB_API_TOKEN}" -o "$out" "$url"; then
              return 0
            fi
            echo "::warning::Authenticated request failed; retrying without token."
          fi
          "${CURL[@]}" -o "$out" "$url"
        }

        # Resolve version
        if [ "$INPUT_VERSION" = "latest" ]; then
          fetch "${RUNNER_TEMP}/release.json" "https://api.github.com/repos/${REPO}/releases/latest"
          TAG=$(grep '"tag_name"' "${RUNNER_TEMP}/release.json" | head -n1 | cut -d'"' -f4)
          if [ -z "${TAG:-}" ]; then
            echo "::error::Could not resolve the latest upkg release."
            exit 1
          fi
          VERSION="${TAG#upkg-v}"
        else
          VERSION="${INPUT_VERSION#v}"
          TAG="upkg-v${VERSION}"
        fi
        echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

        # Detect platform
        OS="$(uname -s)"
        ARCH="$(uname -m)"

        case "${OS}" in
          Linux)
            case "${ARCH}" in
              x86_64)  TARGET="x86_64-unknown-linux-gnu" ;;
              aarch64) TARGET="aarch64-unknown-linux-gnu" ;;
              *) echo "::error::Unsupported Linux architecture: ${ARCH}"; exit 1 ;;
            esac
            ARCHIVE="upkg-v${VERSION}-${TARGET}.tar.gz"
            ;;
          Darwin)
            case "${ARCH}" in
              x86_64)  TARGET="x86_64-apple-darwin" ;;
              arm64)   TARGET="aarch64-apple-darwin" ;;
              *) echo "::error::Unsupported macOS architecture: ${ARCH}"; exit 1 ;;
            esac
            ARCHIVE="upkg-v${VERSION}-${TARGET}.tar.gz"
            ;;
          MINGW*|MSYS*|CYGWIN*|Windows_NT)
            TARGET="x86_64-pc-windows-msvc"
            ARCHIVE="upkg-v${VERSION}-${TARGET}.zip"
            ;;
          *)
            echo "::error::Unsupported OS: ${OS}"
            exit 1
            ;;
        esac

        BASE="https://github.com/${REPO}/releases/download/${TAG}"

        # Download archive (release assets are public — no auth needed)
        echo "Downloading upkg ${VERSION} for ${TARGET}..."
        "${CURL[@]}" -o "${RUNNER_TEMP}/${ARCHIVE}" "${BASE}/${ARCHIVE}"

        # Verify checksum against the release's SHA256SUMS.txt
        if "${CURL[@]}" -o "${RUNNER_TEMP}/SHA256SUMS.txt" "${BASE}/SHA256SUMS.txt"; then
          EXPECTED=$(grep " ${ARCHIVE}\$" "${RUNNER_TEMP}/SHA256SUMS.txt" | awk '{print $1}' | head -n1)
          if [ -z "${EXPECTED:-}" ]; then
            echo "::error::No checksum for ${ARCHIVE} in SHA256SUMS.txt"
            exit 1
          fi
          if command -v sha256sum >/dev/null 2>&1; then
            ACTUAL=$(sha256sum "${RUNNER_TEMP}/${ARCHIVE}" | awk '{print $1}')
          else
            ACTUAL=$(shasum -a 256 "${RUNNER_TEMP}/${ARCHIVE}" | awk '{print $1}')
          fi
          if [ "${EXPECTED}" != "${ACTUAL}" ]; then
            echo "::error::Checksum mismatch for ${ARCHIVE} (expected ${EXPECTED}, got ${ACTUAL})"
            exit 1
          fi
          echo "Checksum verified: ${ACTUAL}"
        else
          echo "::warning::SHA256SUMS.txt not found for ${TAG}; skipping checksum verification."
        fi

        # Extract
        INSTALL_DIR="${RUNNER_TEMP}/upkg"
        mkdir -p "${INSTALL_DIR}"
        case "${ARCHIVE}" in
          *.tar.gz) tar -xzf "${RUNNER_TEMP}/${ARCHIVE}" -C "${INSTALL_DIR}" ;;
          *.zip)    unzip -q "${RUNNER_TEMP}/${ARCHIVE}" -d "${INSTALL_DIR}" ;;
        esac

        # Add to PATH
        echo "${INSTALL_DIR}" >> "$GITHUB_PATH"

        # Verify
        "${INSTALL_DIR}/upkg" --version

    - name: Refresh native package metadata
      if: ${{ inputs.update == 'true' }}
      shell: bash
      run: |
        set -euo pipefail

        case "$(uname -s)" in
          Linux)
            if command -v apt-get >/dev/null 2>&1; then
              sudo apt-get update -y
            elif command -v dnf >/dev/null 2>&1; then
              sudo dnf makecache -y
            elif command -v yum >/dev/null 2>&1; then
              sudo yum makecache -y
            elif command -v pacman >/dev/null 2>&1; then
              sudo pacman -Sy --noconfirm
            elif command -v zypper >/dev/null 2>&1; then
              sudo zypper --non-interactive refresh
            fi
            ;;
          Darwin)
            if command -v brew >/dev/null 2>&1; then
              brew update
            fi
            ;;
          FreeBSD)
            if command -v pkg >/dev/null 2>&1; then
              sudo pkg update -f
            fi
            ;;
        esac
