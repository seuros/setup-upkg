name: Test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@v6

      - name: Setup upkg (latest)
        uses: ./
        id: setup

      - name: Verify version output
        shell: bash
        run: |
          echo "Installed version: ${{ steps.setup.outputs.version }}"
          upkg --version

      - name: Verify dry-run
        shell: bash
        run: upkg --help

  # Job containers run as root without sudo; Alpine has no bash or curl.
  # JavaScript actions (checkout) only run in Alpine containers on x64.
  container:
    name: Container (${{ matrix.image }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: "buildpack-deps:trixie-curl", os: ubuntu-24.04 }
          - { image: "buildpack-deps:trixie-curl", os: ubuntu-24.04-arm }
          - { image: "alpine:latest", os: ubuntu-24.04 }
    steps:
      - uses: actions/checkout@v6

      - name: Setup upkg (latest)
        uses: ./
        id: setup

      - name: Install a package as root
        shell: sh
        run: |
          echo "Installed version: ${{ steps.setup.outputs.version }}"
          upkg --version
          upkg install jq
          jq --version

  # A VM the job starts runs no actions: setup-upkg installs on the host,
  # then its setup.sh runs again inside the VM, pinned to the version the
  # host resolved (FreeBSD's fetch sends no token, a pinned install needs
  # none).
  freebsd:
    name: FreeBSD VM
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Setup upkg (resolves the version on the host)
        uses: ./
        id: setup
        with:
          update: 'false'

      - uses: vmactions/freebsd-vm@v1
        env:
          INPUT_VERSION: ${{ steps.setup.outputs.version }}
        with:
          release: "15.1"
          usesh: true
          copyback: false
          envs: INPUT_VERSION
          run: |
            sh setup.sh
            upkg --version
            upkg install jq
            jq --version
