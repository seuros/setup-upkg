name: Test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@v6

      - name: Setup upkg (latest)
        uses: ./
        id: setup

      - name: Verify version output
        shell: bash
        run: |
          echo "Installed version: ${{ steps.setup.outputs.version }}"
          upkg --version

      - name: Verify dry-run
        shell: bash
        run: upkg --help
